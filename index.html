<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass • Yangi yil chiroqlari</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #060913;
      overflow: hidden;
      position: relative;
      padding: 28px;
      color: #ffffff;
    }

    /* Orqa fondagi suyuq harakatlanuvchi sharlar */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      filter: blur(60px);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      animation: floatLiquid 14s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
      top: -10%;
      left: 10%;
      animation-duration: 12s;
    }

    .orb-2 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #f093fb 0%, #f5576c 100%);
      bottom: -15%;
      right: 8%;
      animation-duration: 16s;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #7f00ff 0%, #e100ff 100%);
      top: 40%;
      left: 45%;
      animation-duration: 18s;
      animation-delay: -6s;
    }

    @keyframes floatLiquid {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        border-radius: 45% 55% 60% 40% / 55% 45% 55% 45%;
      }
      50% {
        transform: translate(60px, -40px) scale(1.12) rotate(90deg);
        border-radius: 60% 40% 45% 55% / 40% 60% 45% 55%;
      }
      100% {
        transform: translate(-50px, 50px) scale(0.95) rotate(180deg);
        border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%;
      }
    }

    /* Liquid Glass asosiy oyna */
    .liquid-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 490px;
      padding: 40px 34px;
      border-radius: 32px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1.5px solid rgba(255, 255, 255, 0.32);
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.65),
        inset 0 -1px 2px rgba(255, 255, 255, 0.15);
    }

    /* Yangi yil chiroqlari qatori (4 tomonlama) */
    .lights-top, .lights-bottom {
      position: absolute;
      left: 22px;
      right: 22px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }

    .lights-top { top: -8px; }
    .lights-bottom { bottom: -8px; }

    .lights-left, .lights-right {
      position: absolute;
      top: 26px;
      bottom: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }

    .lights-left { left: -8px; }
    .lights-right { right: -8px; }

    /* Har bir chiroqcha dizayni */
    .bulb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      position: relative;
      animation: twinkle 1.6s infinite alternate ease-in-out;
    }

    .bulb::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
    }

    /* Chiroqlarning ranglari */
    .c-red {
      background: #ff2a5f;
      box-shadow: 0 0 12px #ff2a5f, 0 0 24px #ff2a5f;
      animation-delay: 0s;
    }
    .c-gold {
      background: #ffd000;
      box-shadow: 0 0 12px #ffd000, 0 0 24px #ffd000;
      animation-delay: 0.4s;
    }
    .c-green {
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88, 0 0 24px #00ff88;
      animation-delay: 0.8s;
    }
    .c-blue {
      background: #00d2ff;
      box-shadow: 0 0 12px #00d2ff, 0 0 24px #00d2ff;
      animation-delay: 1.2s;
    }
    .c-purple {
      background: #d946ef;
      box-shadow: 0 0 12px #d946ef, 0 0 24px #d946ef;
      animation-delay: 0.6s;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.35;
        transform: scale(0.85);
        filter: brightness(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.18);
        filter: brightness(1.3);
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 26px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.65);
      box-shadow:
        0 0 20px rgba(79, 172, 254, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    button {
      padding: 14px 24px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.32),
        rgba(255, 255, 255, 0.12)
      );
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transition: all 0.25s ease;
    }

    button:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.45),
        rgba(255, 255, 255, 0.2)
      );
      transform: translateY(-2px);
      box-shadow:
        0 12px 24px rgba(0, 0, 0, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    button:active {
      transform: scale(0.97);
    }

    .list-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    ul {
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    ul::-webkit-scrollbar {
      width: 5px;
    }

    ul::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
    }

    li {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3);
      padding: 13px 16px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #ffffff;
      animation: dropIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      transition: background 0.2s;
    }

    li:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    li small {
      font-weight: 400;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="liquid-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="liquid-card">
    <!-- Yuqori chiroqlar -->
    <div class="lights-top">
      <span class="bulb c-red"></span>
      <span class="bulb c-gold"></span>
      <span class="bulb c-green"></span>
      <span class="bulb c-blue"></span>
      <span class="bulb c-purple"></span>
      <span class="bulb c-red"></span>
      <span class="bulb c-gold"></span>
      <span class="bulb c-green"></span>
      <span class="bulb c-blue"></span>
      <span class="bulb c-purple"></span>
      <span class="bulb c-red"></span>
    </div>

    <!-- Pastki chiroqlar -->
    <div class="lights-bottom">
      <span class="bulb c-blue"></span>
      <span class="bulb c-purple"></span>
      <span class="bulb c-red"></span>
      <span class="bulb c-gold"></span>
      <span class="bulb c-green"></span>
      <span class="bulb c-blue"></span>
      <span class="bulb c-purple"></span>
      <span class="bulb c-red"></span>
      <span class="bulb c-gold"></span>
      <span class="bulb c-green"></span>
      <span class="bulb c-blue"></span>
    </div>

    <!-- Chap chiroqlar -->
    <div class="lights-left">
      <span class="bulb c-gold"></span>
      <span class="bulb c-green"></span>
      <span class="bulb c-blue"></span>
      <span class="bulb c-purple"></span>
      <span class="bulb c-red"></span>
      <span class="bulb c-gold"></span>
      <span class="bulb c-green"></span>
      <span class="bulb c-blue"></span>
    </div>

    <!-- O'ng chiroqlar -->
    <div class="lights-right">
      <span class="bulb c-purple"></span>
      <span class="bulb c-red"></span>
      <span class="bulb c-gold"></span>
      <span class="bulb c-green"></span>
      <span class="bulb c-blue"></span>
      <span class="bulb c-purple"></span>
      <span class="bulb c-red"></span>
      <span class="bulb c-gold"></span>
    </div>

    <h1>Ismingizni qoldiring</h1>
    <p class="subtitle">Liquid Glass • Bayramona kayfiyat</p>

    <div class="input-group">
      <input id="name" placeholder="Ismingiz..." autocomplete="off" />
      <button onclick="add()">Saqlash</button>
    </div>

    <div class="list-title">Oxirgi yozilganlar:</div>
    <ul id="list"></ul>
  </div>

  <script>
    const API = "/.netlify/functions/api";

    async function load() {
      const rows = await (await fetch(API)).json();
      const ul = document.getElementById("list");
      ul.innerHTML = "";
      rows.forEach(r => {
        const li = document.createElement("li");
        li.textContent = r.name + " ";
        const s = document.createElement("small");
        s.textContent = "(" + new Date(r.created_at).toLocaleString() + ")";
        li.appendChild(s);
        ul.appendChild(li);
      });
    }

    async function add() {
      const input = document.getElementById("name");
      const name = input.value.trim();
      if (!name) return;
      await fetch(API, { method: "POST", body: JSON.stringify({ name }) });
      input.value = "";
      load();
    }

    document.getElementById("name").addEventListener("keypress", function(e) {
      if (e.key === "Enter") add();
    });

    load();
  </script>
</body>
</html>
