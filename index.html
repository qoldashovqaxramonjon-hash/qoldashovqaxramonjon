<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySQL demo — Ismingizni qoldiring</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.75)),
        url('https://unsplash.com');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 20px;
      color: #1e293b;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 26px;
      text-align: center;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 12px 22px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.35);
    }

    button:active {
      transform: translateY(0);
    }

    .list-title {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    ul {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #0f172a;
      animation: fadeIn 0.3s ease;
    }

    li small {
      font-weight: 400;
      font-size: 12px;
      color: #64748b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ismingizni qoldiring</h1>
    <p class="subtitle">Ma’lumotlar bazasiga ismingizni yozib qoldiring</p>

    <div class="input-group">
      <input id="name" placeholder="Ism" />
      <button onclick="add()">Saqlash</button>
    </div>

    <div class="list-title">Oxirgi yozilganlar:</div>
    <ul id="list"></ul>
  </div>

  <script>
    const API = "/.netlify/functions/api";

    async function load() {
      const rows = await (await fetch(API)).json();
      const ul = document.getElementById("list");
      ul.innerHTML = "";
      rows.forEach(r => {
        const li = document.createElement("li");
        li.textContent = r.name + " ";
        const s = document.createElement("small");
        s.textContent = "(" + new Date(r.created_at).toLocaleString() + ")";
        li.appendChild(s);
        ul.appendChild(li);
      });
    }

    async function add() {
      const input = document.getElementById("name");
      const name = input.value.trim();
      if (!name) return;
      await fetch(API, { method: "POST", body: JSON.stringify({ name }) });
      input.value = "";
      load();
    }

    load();
  </script>
</body>
</html>
