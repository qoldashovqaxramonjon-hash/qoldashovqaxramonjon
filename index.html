<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ADU • Liquid Glass</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #091e2c, #040711 60%, #0d081d 100%);
      overflow-x: hidden;
      position: relative;
      padding: 20px 16px;
      color: #ffffff;
    }

    /* Orqa fondagi suyuq yorug'lik to'lqinlari */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      filter: blur(70px);
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      animation: floatLiquid 16s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.55) 0%, rgba(6, 182, 212, 0.2) 100%);
      top: -12%;
      left: -8%;
      animation-duration: 15s;
    }

    .orb-2 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.5) 0%, rgba(168, 85, 247, 0.18) 100%);
      bottom: -15%;
      right: -10%;
      animation-duration: 19s;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(236, 72, 153, 0.12) 100%);
      top: 45%;
      left: 42%;
      animation-duration: 21s;
      animation-delay: -7s;
    }

    @keyframes floatLiquid {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        border-radius: 45% 55% 60% 40% / 55% 45% 55% 45%;
      }
      50% {
        transform: translate(45px, -35px) scale(1.12) rotate(90deg);
        border-radius: 60% 40% 45% 55% / 40% 60% 45% 55%;
      }
      100% {
        transform: translate(-35px, 35px) scale(0.95) rotate(180deg);
        border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%;
      }
    }

    /* DOIMIY OCHIQ VA ANIMATSIYALI ADU LOGOTIPI */
    .adu-logo-badge {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 10px 20px 10px 10px;
      border-radius: 22px;
      text-decoration: none;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(52, 211, 153, 0.55);
      overflow: hidden;
      cursor: pointer;
      animation: badgePulse 4s infinite ease-in-out;
      transition: transform 0.35s ease, border-color 0.35s ease;
    }

    /* Doimiy nafas oluvchi neon nur animatsiyasi */
    @keyframes badgePulse {
      0%, 100% {
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.4),
          0 0 15px rgba(16, 185, 129, 0.25),
          inset 0 1px 1px rgba(255, 255, 255, 0.7);
      }
      50% {
        box-shadow:
          0 16px 36px rgba(16, 185, 129, 0.35),
          0 0 26px rgba(6, 182, 212, 0.45),
          inset 0 1px 2px rgba(255, 255, 255, 0.9);
      }
    }

    /* Doimiy o'tib turuvchi shisha yaltirashi */
    .adu-logo-badge::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-25deg);
      animation: glassSweep 4.5s infinite ease-in-out;
    }

    @keyframes glassSweep {
      0% { left: -120%; }
      45%, 100% { left: 170%; }
    }

    .adu-logo-badge:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: rgba(56, 189, 248, 0.9);
    }

    .adu-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(145deg, #ffffff, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      animation: emblemFloat 3.5s infinite ease-in-out;
    }

    @keyframes emblemFloat {
      0%, 100% { transform: rotate(-4deg) scale(1); }
      50% { transform: rotate(4deg) scale(1.06); }
    }

    .adu-icon-wrap svg {
      width: 100%;
      height: 100%;
    }

    .adu-title-box {
      margin-left: 12px;
      white-space: nowrap;
    }

    .adu-title-box strong {
      display: block;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #ffffff;
    }

    .adu-title-box span {
      display: block;
      font-size: 11.5px;
      color: #6ee7b7;
      margin-top: 2px;
    }

    /* Liquid Glass asosiy oyna */
    .liquid-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      padding: 32px 28px 24px;
      border-radius: 30px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.13) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.55),
        inset 0 -1px 2px rgba(255, 255, 255, 0.12);
    }

    .liquid-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.68);
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: all 0.25s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(16, 185, 129, 0.75);
      box-shadow:
        0 0 20px rgba(16, 185, 129, 0.28),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
    }

    button {
      padding: 14px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: linear-gradient(
        135deg,
        rgba(16, 185, 129, 0.45),
        rgba(6, 182, 212, 0.25)
      );
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.65);
      transition: all 0.25s ease;
    }

    button:hover {
      background: linear-gradient(
        135deg,
        rgba(16, 185, 129, 0.65),
        rgba(6, 182, 212, 0.4)
      );
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.97);
    }

    .list-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    ul {
      list-style: none;
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    ul::-webkit-scrollbar {
      width: 4px;
    }

    ul::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
    }

    li {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.22);
      padding: 12px 14px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
      animation: dropIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      word-break: break-word;
    }

    li:hover {
      background: rgba(255, 255, 255, 0.11);
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 400;
      font-size: 11.5px;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.28);
      padding: 4px 9px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .date-badge svg {
      width: 13px;
      height: 13px;
      stroke: #34d399;
      flex-shrink: 0;
    }

    .status-footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.75);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 12px;
    }

    .stat-pill strong {
      color: #34d399;
      font-weight: 700;
    }

    .stat-pill svg {
      width: 14px;
      height: 14px;
      stroke: #38bdf8;
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* TELEFON VA KICHIK EKRANLAR UCHUN ADAPTIVLIK */
    @media (max-width: 720px) {
      body {
        justify-content: flex-start;
        padding: 16px 14px 28px;
      }

      .adu-logo-badge {
        position: relative;
        top: auto;
        left: auto;
        width: 100%;
        max-width: 500px;
        margin-bottom: 16px;
        padding: 10px 14px;
      }

      .adu-icon-wrap {
        width: 44px;
        height: 44px;
      }

      .adu-title-box strong {
        font-size: 14px;
      }

      .liquid-card {
        padding: 24px 18px 20px;
        border-radius: 26px;
      }

      h1 {
        font-size: 22px;
      }

      .subtitle {
        font-size: 13px;
        margin-bottom: 20px;
      }

      .input-group {
        flex-direction: column;
        gap: 10px;
      }

      input, button {
        width: 100%;
        padding: 13px 16px;
        font-size: 16px;
      }

      li {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 12px 14px;
      }

      .status-footer {
        flex-direction: column;
        align-items: stretch;
      }

      .stat-pill {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="liquid-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Doimiy ochiq va animatsiyali Andijon davlat universiteti logotipi -->
  <a href="https://adu.uz" target="_blank" class="adu-logo-badge" title="Andijon davlat universiteti">
    <div class="adu-icon-wrap">
      <!-- Ichki vektorli ADU nishoni (hech qachon uzilmaydi) -->
      <svg viewBox="0 0 100 100" xmlns="http://w3.org">
        <defs>
          <linearGradient id="aduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#aduGrad)" stroke-width="5" />
        <circle cx="50" cy="50" r="39" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" />
        <!-- Quyosh nurlari -->
        <circle cx="50" cy="31" r="9" fill="#f59e0b" />
        <!-- Ochiq kitob -->
        <path d="M24 58 Q37 52 50 58 Q63 52 76 58 L76 42 Q63 36 50 42 Q37 36 24 42 Z" fill="url(#aduGrad)" />
        <line x1="50" y1="42" x2="50" y2="58" stroke="#ffffff" stroke-width="2" />
        <!-- ADU matni -->
        <text x="50" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="1">ADU</text>
      </svg>
    </div>
    <div class="adu-title-box">
      <strong>Andijon davlat universiteti</strong>
      <span>adu.uz • Rasmiy sahifa</span>
    </div>
  </a>

  <div class="liquid-card">
    <h1>Ismingizni qoldiring</h1>
    <p class="subtitle">Liquid Glass • Ma’lumotlar bazasi</p>

    <div class="input-group">
      <input id="name" placeholder="Ismingiz..." autocomplete="off" />
      <button onclick="add()">Saqlash</button>
    </div>

    <div class="list-title">Oxirgi yozilganlar:</div>
    <ul id="list"></ul>

    <div class="status-footer">
      <div class="stat-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Jami xabarlar: <strong id="msgCount">0</strong> ta</span>
      </div>

      <div class="stat-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Soat: <strong id="liveClock">--:--:--</strong></span>
      </div>
    </div>
  </div>

  <script>
    const API = "/.netlify/functions/api";

    const calendarIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    `;

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('uz-UZ', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById("liveClock").textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function load() {
      const rows = await (await fetch(API)).json();
      const ul = document.getElementById("list");
      const msgCount = document.getElementById("msgCount");

      ul.innerHTML = "";
      msgCount.textContent = rows.length;

      rows.forEach(r => {
        const li = document.createElement("li");

        const nameSpan = document.createElement("span");
        nameSpan.textContent = r.name;

        const dateBadge = document.createElement("span");
        dateBadge.className = "date-badge";
        dateBadge.innerHTML = `${calendarIcon} <span>${new Date(r.created_at).toLocaleString()}</span>`;

        li.appendChild(nameSpan);
        li.appendChild(dateBadge);
        ul.appendChild(li);
      });
    }

    async function add() {
      const input = document.getElementById("name");
      const name = input.value.trim();
      if (!name) return;
      await fetch(API, { method: "POST", body: JSON.stringify({ name }) });
      input.value = "";
      load();
    }

    document.getElementById("name").addEventListener("keypress", function(e) {
      if (e.key === "Enter") add();
    });

    load();
  </script>
</body>
</html>
